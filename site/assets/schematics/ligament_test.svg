<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img"><title>Bone-ligament-bone quasi-static tensile test</title><style>.bone{fill:#8a949e;fill-opacity:.16;stroke:#8a949e;stroke-width:1.3;stroke-linejoin:round}.cup{fill:#8a949e;fill-opacity:.32;stroke:#8a949e;stroke-width:1.2}.gnd{fill:none;stroke:#8a949e;stroke-width:1}.lig{fill:#d9822b;fill-opacity:.28;stroke:#d9822b;stroke-width:1.6}.fib{fill:none;stroke:#d9822b;stroke-width:1;opacity:.8}.dim{fill:none;stroke:#7a8590;stroke-width:1}.arr{fill:none;stroke:#3b82c4;stroke-width:2.2;stroke-linecap:round}text{font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;font-size:11px;fill:#7a8590}.sm{font-size:10px}.b{font-weight:600}.ta{fill:#3b82c4}.tl{fill:#d9822b}</style>
<defs><marker id="ligtest_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" fill="#3b82c4"/></marker><marker id="ligtest_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" fill="#7a8590"/></marker></defs>
<!-- moving grip + upper bone -->
<rect class="cup" x="80" y="22" width="80" height="16" rx="2"/>
<rect class="bone" x="90" y="38" width="60" height="34" rx="5"/>
<!-- ligament -->
<path class="lig" d="M104 72 L136 72 L134 128 L106 128 Z"/>
<path class="fib" d="M111 74 L111 126 M120 74 L120 126 M129 74 L129 126"/>
<!-- lower bone + fixed grip -->
<rect class="bone" x="90" y="128" width="60" height="34" rx="5"/>
<rect class="cup" x="80" y="162" width="80" height="16" rx="2"/>
<path class="gnd" d="M70 178 L170 178 M78 178 L70 188 M92 178 L84 188 M106 178 L98 188 M120 178 L112 188 M134 178 L126 188 M148 178 L140 188 M162 178 L154 188"/>
<!-- pull arrow -->
<path class="arr" d="M120 20 L120 4" marker-end="url(#ligtest_a)"/>
<text x="128" y="14" class="ta b">F, ΔL (quasi-static)</text>
<!-- L0 dimension -->
<path class="dim" d="M62 72 L62 128" marker-start="url(#ligtest_d)" marker-end="url(#ligtest_d)"/>
<path class="dim" d="M58 72 L102 72 M58 128 L104 128"/>
<text x="54" y="104" text-anchor="end" class="b">L0</text>
<text x="120" y="204" text-anchor="middle" class="sm">fixed</text>
<!-- labels -->
<text x="146" y="104" class="tl b">ligament</text>
<text x="146" y="117" class="sm">along fibres, area A0</text>
<text x="196" y="52" class="sm">bone</text>
<text x="196" y="150" class="sm">bone</text>
<path class="dim" d="M152 54 L192 49 M152 145 L192 147"/>
<text x="196" y="176" class="b">ε = (L − L0) / L0</text>
<text x="196" y="193" class="b">σ = F / A0</text>
<text x="196" y="208" class="sm">L0 = zero-force length</text>
</svg>
