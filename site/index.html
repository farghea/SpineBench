<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpineBench</title>
<meta name="description" content="Validation data for thoracic and lumbar spine musculoskeletal and finite element models, each value traced to its table or figure.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>
  try { var t = localStorage.getItem('sb-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#" aria-label="SpineBench home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1.5"/><rect x="7.5" y="8" width="9" height="4" rx="1.5"/><rect x="7" y="14" width="10" height="4" rx="1.5"/><rect x="6.5" y="20" width="11" height="2.5" rx="1.2"/></svg>
      <span>SpineBench</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#browse" data-nav="browse">Browse</a>
      <a href="#groups" data-nav="groups">Compare</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <label class="sr" for="q">Search tests</label>
      <input type="search" id="q" placeholder="Search: L4-L5, IDP, Wilke 2001" autocomplete="off">
    </form>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>
<div class="example-bar" id="example-bar" hidden></div>
<main id="main" tabindex="-1">
  <p class="loading">Loading data</p>
</main>
<footer class="foot">
  <div class="foot-in">
    <span>SpineBench</span>
    <span id="foot-build"></span>
    <a href="data/all.json" download>all.json</a>
    <a href="data/all.csv" download>all.csv</a>
    <a href="data/SCHEMA.md">Schema</a>
  </div>
</footer>
<noscript><p class="wrap">SpineBench needs JavaScript for browsing. The raw data is at <a href="data/all.csv">data/all.csv</a> and <a href="data/all.json">data/all.json</a>.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
